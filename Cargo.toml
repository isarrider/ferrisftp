[package]
name = "ferrisftp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight SFTP server — a drop-in sftp-server subsystem for Dropbear and OpenSSH"
license = "MIT"
repository = "https://github.com/isarrider/ferrisftp"
readme = "README.md"
keywords = ["sftp", "ssh", "dropbear", "server", "embedded"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
