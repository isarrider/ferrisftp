name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Interop with OpenSSH sftp client
        run: |
          cargo build --release
          mkdir -p /tmp/interop/remote
          head -c 3000000 /dev/urandom > /tmp/interop/src.bin
          cat > /tmp/interop/batch <<EOF
          cd /tmp/interop/remote
          mkdir d
          put /tmp/interop/src.bin d/f.bin
          rename d/f.bin d/g.bin
          ls -la d
          get d/g.bin /tmp/interop/back.bin
          df -h d
          ln d/g.bin d/hard.bin
          ln -s g.bin d/soft.bin
          cp d/g.bin d/copy.bin
          ls -l d
          get d/copy.bin /tmp/interop/copy-back.bin
          rm d/*
          rmdir d
          EOF
          sftp -b /tmp/interop/batch -D "$PWD/target/release/ferrisftp"
          cmp /tmp/interop/src.bin /tmp/interop/back.bin
          cmp /tmp/interop/src.bin /tmp/interop/copy-back.bin

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz the decoder
        run: cargo fuzz run decode -- -max_total_time=60
        working-directory: fuzz
      - name: Fuzz read-only sessions
        run: cargo fuzz run session -- -max_total_time=120 -timeout=10
        working-directory: fuzz
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  install-script:
    # scripts/install.sh on clean Debian systems like DietPi's (Trixie ships
    # Dropbear 2025.89), on x86_64 and on real arm64 runners.
    name: install.sh on ${{ matrix.image }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ['debian:trixie', 'debian:bookworm']
    steps:
      - name: Install Dropbear and an SSH client
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            dropbear-bin openssh-client curl ca-certificates procps > /dev/null
      - uses: actions/checkout@v4
      - run: scripts/test-install.sh
