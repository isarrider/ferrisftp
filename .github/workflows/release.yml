name: Release builds

# Static musl binaries for every architecture DietPi supports. Each one is
# tested under QEMU emulating the oldest CPU it has to run on.
#
# Publishing a release for the version in Cargo.toml, either way:
# - in the browser: Actions > Release builds > Run workflow, tick
#   "Publish a release" (the workflow creates the tag itself)
# - from a terminal: push a tag vX.Y.Z matching that version
# Pull requests rehearse the release job without publishing.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release for the version in Cargo.toml
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv6l
            target: arm-unknown-linux-musleabihf
            qemu_cpu: arm1176 # Raspberry Pi 1, Zero
          - arch: armv7l
            target: armv7-unknown-linux-musleabihf
            qemu_cpu: cortex-a7 # Raspberry Pi 2
            too_old_cpu: arm1176
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            qemu_cpu: cortex-a53 # Raspberry Pi 3
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: riscv64
            target: riscv64gc-unknown-linux-musl
            qemu_cpu: rv64
    env:
      TARGET: ${{ matrix.target }}
      # Read by qemu-user, including when started through binfmt_misc.
      QEMU_CPU: ${{ matrix.qemu_cpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up QEMU
        if: matrix.qemu_cpu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64,riscv64

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Check the binary
        run: |
          bin="target/$TARGET/release/ferrisftp"
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          echo "size: $(stat -c %s "$bin") bytes"
          "$bin" -V

      - name: Check that QEMU enforces the CPU model
        if: matrix.too_old_cpu
        run: |
          # This binary needs a newer CPU, so emulating an older one must
          # make it fail. If it ran, QEMU_CPU would not take effect and the
          # CPU-specific tests in this workflow would prove nothing.
          if QEMU_CPU=${{ matrix.too_old_cpu }} "target/$TARGET/release/ferrisftp" -V; then
            echo "QEMU_CPU=${{ matrix.too_old_cpu }} was not enforced"
            exit 1
          fi
          echo "OK: refused to run on ${{ matrix.too_old_cpu }}, as expected"

      - name: Test suite
        run: cargo test --locked --target "$TARGET"

      - name: Interop with OpenSSH sftp client
        run: |
          bin="$PWD/target/$TARGET/release/ferrisftp"
          w=$(mktemp -d)
          mkdir "$w/remote"
          head -c 3000000 /dev/urandom > "$w/src.bin"
          cat > "$w/batch" <<EOF
          cd $w/remote
          mkdir d
          put $w/src.bin d/f.bin
          rename d/f.bin d/g.bin
          ls -la d
          get d/g.bin $w/back.bin
          df -h d
          ln d/g.bin d/hard.bin
          ln -s g.bin d/soft.bin
          cp d/g.bin d/copy.bin
          ls -l d
          get d/copy.bin $w/copy-back.bin
          rm d/*
          rmdir d
          EOF
          sftp -b "$w/batch" -D "$bin -e -l INFO"
          cmp "$w/src.bin" "$w/back.bin"
          cmp "$w/src.bin" "$w/copy-back.bin"

      - name: End-to-end behind Dropbear
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y -qq dropbear-bin rclone python3-paramiko > /dev/null
          sudo scripts/dropbear-e2e.sh "target/$TARGET/release/ferrisftp" --yes

      - name: Footprint, compared with Green End and OpenSSH
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y -qq time bc gesftpserver openssh-sftp-server > /dev/null
          cargo build --release --locked
          SIZE_MIB=1024 RUNS=5 FILES=10000 scripts/footprint.sh \
            "target/$TARGET/release/ferrisftp" \
            target/release/ferrisftp \
            "$(dpkg -L gesftpserver | grep -m1 '/gesftpserver$')" \
            /usr/lib/openssh/sftp-server

      - name: Package
        run: |
          mkdir dist
          cp "target/$TARGET/release/ferrisftp" "dist/ferrisftp-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ferrisftp-${{ matrix.arch }}
          path: dist/ferrisftp-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') || inputs.release ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/tags/* ]] && gh release view "$tag" > /dev/null 2>&1; then
            if [ "$PUBLISH" = true ]; then
              echo "release $tag already exists; bump the version in Cargo.toml first"
              exit 1
            fi
            echo "note: release $tag already exists"
          fi
          echo "release tag: $tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: ferrisftp-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          chmod +x ferrisftp-*
          sha256sum ferrisftp-* > SHA256SUMS
          cat SHA256SUMS
          [ "$(ls ferrisftp-* | wc -l)" = 5 ]
      - name: Publish
        if: env.PUBLISH == 'true'
        # Creates the tag on this commit when it does not exist yet.
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "ferrisftp $TAG" --generate-notes
      - name: Rehearsal (pull requests only)
        if: env.PUBLISH != 'true'
        run: |
          echo "would publish $TAG for $GITHUB_SHA with:"
          ls -l dist
